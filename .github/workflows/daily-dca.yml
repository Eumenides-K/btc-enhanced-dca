name: Daily BTC Enhanced DCA

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-dca-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DCA script
        id: run_dca
        continue-on-error: true
        run: |
          set +e
          python src/main.py > run.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
        env:
          PYTHONPATH: .
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BASE_INVESTMENT_AMOUNT: ${{ vars.BASE_INVESTMENT_AMOUNT || secrets.BASE_INVESTMENT_AMOUNT || '10.0' }}
          MIN_MULTIPLIER: ${{ vars.MIN_MULTIPLIER || secrets.MIN_MULTIPLIER || '0.1' }}
          MAX_MULTIPLIER: ${{ vars.MAX_MULTIPLIER || secrets.MAX_MULTIPLIER || '4.0' }}

      - name: Update investment records
        if: always()
        run: python -m src.reporting.record_updater

      - name: Generate dashboard
        if: always()
        run: python -m src.reporting.dashboard_generator

      - name: Build issue content
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path("run.log")
          log = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""

          run_result = {}
          result_path = Path("run_result.json")
          if result_path.exists():
              run_result = json.loads(result_path.read_text(encoding="utf-8"))

          info_pattern = re.compile(
              r"\[INFO\]\s*Ahr999:\s*([^\s]+)\s*Investment amount:\s*([^\s]+)\s*current price:\s*\$?([^\s]+)",
              re.IGNORECASE,
          )
          info_matches = info_pattern.findall(log)
          ahr999 = invest_amount = current_price = "N/A"
          if info_matches:
              ahr999, invest_amount, current_price = info_matches[-1]

          if run_result:
              ahr999 = str(run_result.get("ahr999", ahr999))
              invest_amount = str(run_result.get("planned_invest_usdt", invest_amount))
              current_price = str(run_result.get("btc_price", current_price))

          exit_code = os.environ.get("EXIT_CODE", "1")
          run_ok = exit_code == "0"
          is_insufficient = "insufficient usdt balance" in log.lower() or "insufficientbalanceerror" in log.lower()
          error_lines = [line.strip() for line in log.splitlines() if line.strip().startswith("[ERROR]")]
          exception_reason = error_lines[0] if error_lines else f"Process exited with code {exit_code}"
          executed_invest = str(run_result.get("executed_invest_usdt", "N/A")) if run_result else "N/A"
          executed_btc = str(run_result.get("executed_btc_amount", "N/A")) if run_result else "N/A"

          latest_metrics = ""
          records_path = Path("data/investment_records.csv")
          if records_path.exists():
              with records_path.open("r", encoding="utf-8", newline="") as f:
                  rows = list(csv.DictReader(f))
              if rows:
                  latest = rows[-1]
                  latest_metrics = f"""
          ## Portfolio Snapshot

          - Cumulative invest (USDT): `{latest.get('cum_invest_usdt', 'N/A')}`
          - Portfolio value (USDT): `{latest.get('portfolio_value_usdt', 'N/A')}`
          - PnL (USDT): `{latest.get('pnl_usdt', 'N/A')}`
          - PnL ratio: `{latest.get('pnl_ratio', 'N/A')}`
          - Benchmark PnL ratio: `{latest.get('benchmark_pnl_ratio', 'N/A')}`
          - Alpha ratio: `{latest.get('alpha_ratio', 'N/A')}`
          """

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          if run_ok:
              title = f"[DCA] Success - {now}"
              body = f"""## DCA Run Result

          - Status: Success
          - Run time: {now}
          - Ahr999: `{ahr999}`
          - Planned investment amount: `{invest_amount}`
          - Executed investment amount: `{executed_invest}`
          - Executed BTC amount: `{executed_btc}`
          - Current price: `{current_price}`
          {latest_metrics}

          ## Raw Log

          ```text
          {log.strip() or 'No log output.'}
          ```
          """
          elif is_insufficient:
              title = f"[DCA] Failed (Insufficient Balance) - {now}"
              body = f"""## DCA Run Result

          - Status: Failed (Insufficient Balance)
          - Run time: {now}
          - Ahr999: `{ahr999}`
          - Planned investment amount: `{invest_amount}`
          - Executed investment amount: `{executed_invest}`
          - Executed BTC amount: `{executed_btc}`
          - Current price: `{current_price}`
          - Message: `insufficient balance`
          {latest_metrics}

          ## Raw Log

          ```text
          {log.strip() or 'No log output.'}
          ```
          """
          else:
              title = f"[DCA] Failed - {now}"
              traceback_block = log.strip() or "No traceback/log captured."
              body = f"""## DCA Run Result

          - Status: Failed
          - Run time: {now}
          - Exception reason: `{exception_reason}`
          - Planned investment amount: `{invest_amount}`
          - Executed investment amount: `{executed_invest}`
          - Executed BTC amount: `{executed_btc}`
          {latest_metrics}

          ## Traceback / Error Log

          ```text
          {traceback_block}
          ```
          """

          Path("issue_title.txt").write_text(title, encoding="utf-8")
          Path("issue_body.md").write_text(body, encoding="utf-8")
          PY
        env:
          EXIT_CODE: ${{ steps.run_dca.outputs.exit_code }}

      - name: Create GitHub issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('issue_title.txt', 'utf8').trim();
            const body = fs.readFileSync('issue_body.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

      - name: Commit records and dashboard
        if: always()
        run: |
          if [ -n "$(git status --porcelain data docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data docs
            git commit -m "chore: update investment records"
            git push
          else
            echo "No data/docs changes to commit."
          fi
