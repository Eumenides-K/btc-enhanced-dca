name: Daily BTC Enhanced DCA

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  run-dca-and-create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DCA script
        id: run_dca
        continue-on-error: true
        run: |
          set +e
          python src/main.py > run.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e
        env:
          PYTHONPATH: .
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BASE_INVESTMENT_AMOUNT: ${{ vars.BASE_INVESTMENT_AMOUNT || '10.0' }}
          MIN_MULTIPLIER: ${{ vars.MIN_MULTIPLIER || '0.1' }}
          MAX_MULTIPLIER: ${{ vars.MAX_MULTIPLIER || '4.0' }}

      - name: Build Issue Content
        id: build_issue
        if: always()
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path("run.log")
          log = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""

          info_pattern = re.compile(
              r"\[INFO\]\s*Ahr999:\s*([^\s]+)\s*Investment amount:\s*([^\s]+)\s*current price:\s*\$?([^\s]+)",
              re.IGNORECASE,
          )
          info_matches = info_pattern.findall(log)
          ahr999 = invest_amount = current_price = "N/A"
          if info_matches:
              ahr999, invest_amount, current_price = info_matches[-1]

          exit_code = os.environ.get("EXIT_CODE", "1")
          run_ok = exit_code == "0"
          is_insufficient = "insufficient usdt balance" in log.lower() or "insufficientbalanceerror" in log.lower()
          error_lines = [line.strip() for line in log.splitlines() if line.strip().startswith("[ERROR]")]
          exception_reason = error_lines[0] if error_lines else f"Process exited with code {exit_code}"

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          if run_ok:
              title = f"[DCA] Success - {now}"
              body = f"""## DCA Run Result

          - Status: Success
          - Run time: {now}
          - Ahr999: `{ahr999}`
          - Investment amount: `{invest_amount}`
          - Current price: `{current_price}`

          ## Raw Log

          ```text
          {log.strip() or 'No log output.'}
          ```
          """
          elif is_insufficient:
              title = f"[DCA] Failed (Insufficient Balance) - {now}"
              body = f"""## DCA Run Result

          - Status: Failed (Insufficient Balance)
          - Run time: {now}
          - Ahr999: `{ahr999}`
          - Investment amount: `{invest_amount}`
          - Current price: `{current_price}`
          - Message: `insufficient balance`

          ## Raw Log

          ```text
          {log.strip() or 'No log output.'}
          ```
          """
          else:
              title = f"[DCA] Failed - {now}"
              traceback_block = log.strip() or "No traceback/log captured."
              body = f"""## DCA Run Result

          - Status: Failed
          - Run time: {now}
          - Exception reason: `{exception_reason}`

          ## Traceback / Error Log

          ```text
          {traceback_block}
          ```
          """

          Path("issue_title.txt").write_text(title, encoding="utf-8")
          Path("issue_body.md").write_text(body, encoding="utf-8")
          PY
        env:
          EXIT_CODE: ${{ steps.run_dca.outputs.exit_code }}

      - name: Create GitHub Issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('issue_title.txt', 'utf8').trim();
            const body = fs.readFileSync('issue_body.md', 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

