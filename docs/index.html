<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC Enhanced DCA Dashboard</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #d97706;
      --accent: #0891b2;
      --line: #e5e7eb;
      --ok: #16a34a;
      --bad: #dc2626;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(160deg, #eef2ff, var(--bg));
      color: var(--text);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(17, 24, 39, 0.06);
    }
    .label { color: var(--muted); font-size: 13px; }
    .value { font-size: 24px; font-weight: 700; margin-top: 8px; }
    .chart-card { margin-top: 12px; }
    .chart-title { margin: 0 0 8px; font-size: 15px; }
    .footer { color: var(--muted); font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BTC Enhanced DCA 表现概览</h1>
    <div class="grid" id="summary"></div>

    <div class="card chart-card">
      <h2 class="chart-title">BTC 价格与平均成本走势</h2>
      <canvas id="trendChart" height="110"></canvas>
    </div>

    <div class="footer">Auto-generated by GitHub Actions.</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const usd = (v) => Number(v || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    const pct = (v) => `${(Number(v || 0) * 100).toFixed(2)}%`;

    fetch("./data/series.json")
      .then((res) => res.json())
      .then((data) => {
        const records = data.records || [];
        const latest = data.summary?.latest;
        const summaryNode = document.getElementById("summary");

        if (!latest) {
          summaryNode.innerHTML = "<div class='card'><div class='label'>Status</div><div class='value'>No data yet</div></div>";
          return;
        }

        const cards = [
          ["BTC 当前价格 (USDT)", usd(latest.btc_price)],
          ["累计投资金额 (USDT)", usd(latest.cum_invest_usdt)],
          ["盈亏比率", pct(latest.pnl_ratio)]
        ];
        summaryNode.innerHTML = cards.map(([k, v]) =>
          `<div class="card"><div class="label">${k}</div><div class="value">${v}</div></div>`
        ).join("");

        const labels = records.map((x) => x.date);
        const strategyAvgCost = records.map((x) => {
          const btcHeld = Number(x.portfolio_value_usdt || 0) / Number(x.btc_price || 0);
          return btcHeld > 0 ? Number(x.cum_invest_usdt || 0) / btcHeld : null;
        });
        const benchmarkAvgCost = records.map((x) => {
          const btcHeld = Number(x.benchmark_value_usdt || 0) / Number(x.btc_price || 0);
          return btcHeld > 0 ? Number(x.cum_invest_usdt || 0) / btcHeld : null;
        });

        const trendCtx = document.getElementById("trendChart");
        new Chart(trendCtx, {
          type: "line",
          data: {
            labels,
            datasets: [
              { label: "BTC价格走势", data: records.map((x) => x.btc_price), borderColor: "#d97706", tension: 0.25, spanGaps: true },
              { label: "普通DCA平均成本走势", data: benchmarkAvgCost, borderColor: "#0891b2", tension: 0.25, spanGaps: true },
              { label: "Enhanced DCA平均成本走势", data: strategyAvgCost, borderColor: "#16a34a", tension: 0.25, spanGaps: true }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
              y: {
                ticks: { callback: (value) => Number(value).toLocaleString(undefined, { maximumFractionDigits: 2 }) }
              }
            }
          }
        });
      })
      .catch((err) => {
        document.getElementById("summary").innerHTML =
          `<div class='card'><div class='label'>Error</div><div class='value'>${err}</div></div>`;
      });
  </script>
</body>
</html>
